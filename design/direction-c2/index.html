<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Soft Comic Page — Ready Set ABC</title>
  <link rel="stylesheet" href="page.css" />
</head>
<body data-confetti="ink">
  <div id="shader" class="shader"></div>
  <div class="dots" aria-hidden="true"></div>
  <canvas id="confetti"></canvas>
  <div class="shell">
    <header class="bar">
      <div class="brand">Ready Set ABC</div>
      <nav class="tabs" aria-label="Sections">
        <button class="tab tab-home" type="button" data-go="home">Play Cards</button>
        <button class="tab tab-trail" type="button" data-go="trail">ABC Trail</button>
        <button class="tab tab-pouch" type="button" data-go="celebration">Star Pouch</button>
      </nav>
      <div class="spacer"></div>
      <div class="audio">
        <button type="button">Music</button>
        <button type="button">SFX</button>
        <button type="button">Voice</button>
      </div>
      <button class="gu" type="button" data-go="grown-ups">Grown-Ups</button>
    </header>
    <main>
      <section class="screen home" data-screen="home">
        <div class="panel mission">
          <p class="kicker pop">Today’s panel</p>
          <h1 class="mega"><span style="--d:.06s">S</span></h1>
          <p class="bubble pop" style="--d:.12s">Woof! I’m Lucy. Tap play and we’ll learn /s/.</p>
          <div class="satpin" aria-label="SATPIN">
            <b class="now">S</b><b>A</b><b>T</b><b>P</b><b>I</b><b>N</b>
          </div>
        </div>
        <div class="panel stage">
          <div class="oval">
            <img src="../assets/lucy-default.jpg" alt="Lucy the golden retriever" />
          </div>
        </div>
        <button class="play" type="button" data-go="trail">Play</button>
      </section>

      <section class="screen" data-screen="trail">
        <h2 class="prompt pop">ABC Trail · follow the gutter</h2>
        <div class="floor">
          <svg class="wide" viewBox="0 0 1000 220" aria-hidden="true">
            <path d="M40,160 C180,20 320,200 500,90 S820,20 970,140" fill="none" stroke="#2c241c" stroke-width="4" stroke-dasharray="8 8"/>
            <circle r="10" fill="#f6d98a" stroke="#2c241c" stroke-width="3">
              <animateMotion dur="3.4s" repeatCount="indefinite" path="M40,160 C180,20 320,200 500,90 S820,20 970,140"/>
            </circle>
          </svg>
          <svg class="tall" viewBox="0 0 360 200"><path d="M20,100 H340" fill="none" stroke="#2c241c" stroke-width="3"/></svg>
        </div>
        <div class="strip">
          <button class="cell done pop" type="button">S</button>
          <button class="cell now pop" type="button" data-go="listen" style="--d:.08s">A</button>
          <button class="cell pop" type="button" style="--d:.12s">T</button>
          <button class="cell pop" type="button" style="--d:.16s">P</button>
          <button class="cell pop" type="button" style="--d:.2s">I</button>
          <button class="cell pop" type="button" style="--d:.24s">N</button>
        </div>
      </section>

      <section class="screen listen" data-screen="listen">
        <h2 class="prompt pop">Which picture starts with /s/?</h2>
        <div class="plates">
          <button class="choice is-picked pop" type="button"><div class="art"><div class="sun"></div></div>Sun</button>
          <button class="choice pop" type="button" style="--d:.1s"><div class="art"><div class="apple"></div></div>Apple</button>
          <button class="choice pop" type="button" style="--d:.18s"><div class="art"><div class="sock"></div></div>Sock</button>
        </div>
        <button class="play" type="button" data-go="celebration">Check</button>
      </section>

      <section class="screen celebration" data-screen="celebration">
        <div class="panel">
          <p class="pop" style="margin:0;letter-spacing:.3em">★ ★ ★</p>
          <h2 class="starword pop">S is for Star</h2>
          <p class="bubble">Three of three. The pouch opens.</p>
          <button class="play" type="button" data-go="home" style="margin-top:12px">Next letter</button>
        </div>
        <div>
          <svg class="trophy" viewBox="0 0 64 72" aria-hidden="true">
            <path fill="currentColor" d="M16 8h32v10c0 10-7 18-16 18S16 28 16 18V8z"/>
            <path fill="none" stroke="currentColor" stroke-width="4" d="M16 14H8c0 8 4 14 10 16M48 14h8c0 8-4 14-10 16"/>
            <path fill="currentColor" d="M30 38h4v12h-4zM20 52h24v7H20z"/>
          </svg>
          <div class="portrait"><img src="../assets/lucy-bows.jpg" alt="Lucy celebrating" /></div>
        </div>
      </section>

      <section class="screen grown" data-screen="grown-ups">
        <div class="panel pop">
          <h2 class="starword" style="font-size:56px">Grown-Ups</h2>
          <div class="pin" aria-label="PIN 1234"><i>1</i><i>2</i><i>3</i><i>4</i></div>
          <div class="row"><span>Today’s letter</span><strong>S · SATPIN</strong></div>
          <div class="row"><span>Round size</span><strong>3 letters</strong></div>
          <div class="row"><span>Offline copy</span><strong>Off</strong></div>
          <div class="row"><span>Roster</span><strong>24 faces</strong></div>
          <button class="play" type="button" data-go="home" style="margin-top:12px">Back to play</button>
        </div>
        <div class="keys">
          <button type="button">1</button><button type="button">2</button><button type="button">3</button>
          <button type="button">4</button><button type="button">5</button><button type="button">6</button>
          <button type="button">7</button><button type="button">8</button><button type="button">9</button>
        </div>
      </section>
    </main>
  </div>
  <div class="veil" aria-hidden="true"></div>
  <nav class="proto" aria-label="Prototype screens">
    <button type="button" data-go="home">Home</button>
    <button type="button" data-go="trail">Trail</button>
    <button type="button" data-go="listen">Listen</button>
    <button type="button" data-go="celebration">Celebrate</button>
    <button type="button" data-go="grown-ups">Grown-Ups</button>
  </nav>
  <style>
    .veil { position: fixed; inset: -10%; z-index: 8; pointer-events: none; background: #2c241c; clip-path: circle(0% at 50% 45%); transition: clip-path .5s cubic-bezier(.7,0,.2,1); }
    body.is-transitioning .veil { clip-path: circle(80% at 50% 45%); }
  </style>
  <script type="module">
    import { boot } from "../shared/engine.js";
    import { mountMesh, prefersReduced } from "../shared/paper-mount.js";
    boot();
    const shader = mountMesh(document.getElementById("shader"), {
      colors: ["#fff6e4", "#f6d98a", "#b9ddf0", "#f3c1b0", "#d5eadc"],
      distortion: 0.85, swirl: 0.4, grainMixer: 0.2, grainOverlay: 0.08, speed: 0.75, scale: 1.15,
    });
    document.addEventListener("phase2:screen", (event) => {
      if (prefersReduced()) return;
      shader.setSpeed(event.detail === "celebration" ? 1.5 : 0.75);
    });
  </script>
</body>
</html>
