<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Shared phoneme ratings storage</title></head>
<body><script>
// A single file URL keeps both file:// layouts on the same localStorage bucket.
'use strict';
const key = 'rsabc-phoneme-test-ratings';
let ratings = {};
addEventListener('message', event => {
  if (event.source !== parent || event.data?.type !== 'phoneme-ratings-request') return;
  let saved = true;
  try {
    let stored;
    try { stored = JSON.parse(localStorage.getItem(key) || '{}'); }
    catch (error) { if (!(error instanceof SyntaxError)) throw error; }
    if (stored && typeof stored === 'object' && !Array.isArray(stored)) ratings = stored;
  } catch { saved = false; }
  if (/^[A-Z]$/.test(event.data.letter) && ['pass', 'fail'].includes(event.data.rating)) {
    ratings[event.data.letter] = event.data.rating;
    try { localStorage.setItem(key, JSON.stringify(ratings)); }
    catch { saved = false; }
  }
  parent.postMessage({type: 'phoneme-ratings-response', ratings, saved}, '*');
});
</script></body></html>
